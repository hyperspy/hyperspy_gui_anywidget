name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: agg
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display versions
        run: |
          python --version
          pip --version

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hyperspy anywidget link_traits pytest
          pip install -e .

      - name: Install optional dependencies (allowed to fail)
        run: |
          pip install exspy pybaselines || true
        continue-on-error: true

      - name: Pip list
        run: |
          pip list

      - name: Run test suite
        run: |
          pytest hyperspy_gui_anywidget/tests/ -v
