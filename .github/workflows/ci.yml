name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - 'dependabot/**'
      - 'pre-commit-ci-update-config'
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.PYTHON_VERSION }}${{ matrix.LABEL }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: agg
      PIP_SELECTOR: '[tests]'
      PYTEST_ARGS: --pyargs hyperspy_gui_anywidget
      PYTEST_ARGS_COVERAGE: --cov=. --cov-report=xml
    strategy:
      fail-fast: false
      matrix:
        PYTHON_VERSION: ['3.11', '3.12', '3.13']
        LABEL: [-release, -dev]
        PIP_ARGS: [""]
        include:
          - PYTHON_VERSION: '3.12'
            PIP_ARGS: --pre
            LABEL: -dev-pre_release
          - PYTHON_VERSION: '3.12'
            LABEL: -release-minimum
          - PYTHON_VERSION: '3.12'
            LABEL: -dev-minimum
          - PYTHON_VERSION: '3.10'
            LABEL: -release
          - PYTHON_VERSION: '3.10'
            LABEL: -oldest
            # Matching pyproject.toml
            DEPENDENCIES: hyperspy==2.4.0 ipywidgets==8.0 anywidget==0.9.0

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: get repository name
        shell: bash
        run: echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Fetch tags upstream
        if: ${{ github.repository_owner != 'hyperspy' }}
        # Needs to fetch the tags from upstream to get the
        # correct version with setuptools_scm
        run: |
          git remote add upstream https://github.com/hyperspy/${{ env.REPOSITORY_NAME }}.git
          git fetch upstream --tags

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: ${{ matrix.PYTHON_VERSION }}

      - name: Display version
        run: |
          python --version
          pip --version

      - name: Install HyperSpy (dev)
        if: contains( matrix.LABEL, 'dev')
        run: |
          pip install git+https://github.com/hyperspy/hyperspy.git@RELEASE_next_minor

      - name: Install exSpy (dev)
        if: contains( matrix.LABEL, 'dev')
        run: |
          pip install git+https://github.com/hyperspy/exspy.git

      - name: Install
        run: |
          pip install ${{ matrix.PIP_ARGS }} .'${{ env.PIP_SELECTOR }}'

      - name: Pip list
        run: |
          pip list  
  
      - name: Install oldest supported version
        if: contains( matrix.LABEL, 'oldest')
        run: |
          pip install ${{ matrix.DEPENDENCIES }}

      - name: Pip list
        run: |
          pip list  

      - name: Run test suite
        run: |
          pytest ${{ env.PYTEST_ARGS }} ${{ env.PYTEST_ARGS_COVERAGE }}

      - name: Upload coverage to Codecov
        if: ${{ always() && env.PYTEST_ARGS_COVERAGE }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[doc]"

      - name: Build documentation
        run: |
          sphinx-build -W -b html docs docs/_build/html
