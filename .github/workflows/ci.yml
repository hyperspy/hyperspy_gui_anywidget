name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install package
        run: |
          pip install -e .

      - name: Verify package imports
        run: |
          python -c "import hyperspy_gui_anywidget"
          python -c "from hyperspy_gui_anywidget import roi, model, axes, tools, preferences, custom_widgets, utils, microscope_parameters"

      - name: Verify hyperspy_extension.yaml entries
        run: |
          python -c "
          import yaml
          with open('hyperspy_gui_anywidget/hyperspy_extension.yaml', 'r') as f:
              data = yaml.safe_load(f)
          count = len(data['GUI']['widgets']['anywidget'])
          print(f'hyperspy_extension.yaml entries: {count}')
          assert count == 33, f'Expected 33 entries, got {count}'
          "

  test:
    name: py${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: agg
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Display versions
        run: |
          python --version
          pip --version

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tests]"

      - name: Install optional dependencies (allowed to fail)
        run: |
          pip install exspy pybaselines || true
        continue-on-error: true

      - name: Pip list
        run: |
          pip list

      - name: Run test suite
        run: |
          pytest hyperspy_gui_anywidget/tests/ -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: agg
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tests]"

      - name: Install optional dependencies (allowed to fail)
        run: |
          pip install exspy pybaselines || true
        continue-on-error: true

      - name: Pip list
        run: |
          pip list

      - name: Run tests with coverage
        run: |
          pytest hyperspy_gui_anywidget/tests/ -v --cov=hyperspy_gui_anywidget --cov-report=xml --cov-report=term --cov-fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[doc]"

      - name: Build documentation
        run: |
          sphinx-build -W -b html docs docs/_build/html
